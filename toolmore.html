<script>
// CDN图片替换逻辑，保留，无其他多余JS
const cdnPrefix = "https://cdn.jsdelivr.net/gh/youxijishiyu/youxijishiyu.github.io@main/";
const isLocal = window.location.protocol === "file:";
document.addEventListener('DOMContentLoaded', function(){
    const allImgs = document.querySelectorAll('img');
    allImgs.forEach((img, idx)=>{
        const oriSrc = img.getAttribute('src');
        if(!oriSrc || oriSrc.startsWith('http')) return;
        if(!isLocal){
            img.src = cdnPrefix + oriSrc;
        }
        if(idx >= 8){
            img.loading = "lazy";
        }
    });
});
</script>
