<!-- kuizuo.html｜愧怍 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>愧怍 中文版 - 游戏下载</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#141418;color:#eee;line-height:1.6;padding:16px}
.container{max-width:900px;margin:0 auto}
.back{display:inline-block;margin-bottom:16px;color:#58a6ff;text-decoration:none}
.cover{width:100%;border-radius:10px;margin-bottom:20px}
h1{font-size:26px;margin-bottom:12px}
.info-block{background:#1e1e26;padding:18px;border-radius:10px;margin:16px 0}
.info-block p{margin:8px 0;color:#ccc}
.download-box{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.dl-btn{padding:14px 24px;border:none;border-radius:8px;font-size:16px;cursor:pointer}
.baidu{background:#2970d9;color:#fff}
.quark{background:#f68220;color:#fff}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:999}
.modal.show{display:flex}
.modal-inner{background:#222;padding:24px;border-radius:12px;text-align:center}
.modal-inner img{width:260px;border-radius:8px}
.close{margin-top:14px;padding:8px 18px;border:none;border-radius:6px;cursor:pointer;background:#444;color:#fff}
</style>
</head>
<body>
<div class="container">
<a href="newgame.html" class="back">← 返回列表</a>
<img class="cover" src="img/newgame/1234.jpg" alt="愧怍">
<h1>愧怍</h1>
<div class="info-block">
<p>📅 入库时间：11.7 日入库</p>
<p>🎮 游戏类型：叙事 / 心理解谜</p>
<p>📦 版本：v2026.11.5 中文版</p>
<p>简介：《Abashed》带你走进艾萨克（Issac）混乱的内心世界，伴随着他过去的碎片在眼前闪现。解谜、遇见神秘角色、改变现实，随着他面对最深的恐惧，揭开他失踪伴侣的真相，或者，真的是这样吗？</p>
</div>
<div class="download-box">
<button class="dl-btn baidu" onclick="openModal('img/kuizuo/baidu_qr.jpg')">百度网盘 提取码：9j2t</button>
<button class="dl-btn quark" onclick="openModal('img/kuizuo/quark_qr.jpg')">夸克网盘 </button>
</div>
</div>
<div class="modal" id="qrModal">
<div class="modal-inner">
<img id="qrImg" src="" alt="二维码">
<br>
<button class="close" onclick="closeModal()">关闭</button>
</div>
</div>
<script>
const modal=document.getElementById('qrModal');
const qrImg=document.getElementById('qrImg');
function openModal(src){qrImg.src=src;modal.classList.add('show')}
function closeModal(){modal.classList.remove('show')}
modal.onclick=e=>{if(e.target===modal)closeModal()}
</script>
</body>
</html>
